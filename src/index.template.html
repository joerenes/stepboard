<title>Stepboard</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=JetBrains+Mono:wght@500&display=swap">
<style>
/*VENDOR_CSS*/
</style>
<style>
/* Layout: lecture-hall chrome. Header and step bar across the top, slide strip on the left, tldraw board filling the rest. */
:root {
  --bg: #eef0ec;          /* chrome */
  --panel: #f7f8f5;
  --line: #d3d8d0;
  --text: #1c2a30;
  --muted: #5b6965;
  --accent: #2f6f8f;      /* slate blue, controls */
  --on-accent: #ffffff;
  --plus: #2e7d4f;
  --minus: #b3401f;
  --frame: #2f6f8f;
  --font-ui: "Atkinson Hyperlegible", system-ui, -apple-system, sans-serif;
  --font-data: "JetBrains Mono", ui-monospace, Menlo, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #161d1f; --panel: #1c2528; --line: #2e3c3f; --text: #e3e9e1; --muted: #93a39d;
  --accent: #7fb8d4; --on-accent: #10181b; --plus: #7fcf9b; --minus: #ff8a65; --frame: #7fb8d4; color-scheme: dark;
} }
:root[data-theme="dark"] {
  --bg: #161d1f; --panel: #1c2528; --line: #2e3c3f; --text: #e3e9e1; --muted: #93a39d;
  --accent: #7fb8d4; --on-accent: #10181b; --plus: #7fcf9b; --minus: #ff8a65; --frame: #7fb8d4; color-scheme: dark;
}
html, body { height: 100%; }
body { background: var(--bg); color: var(--text); font: 14px var(--font-ui); overflow: hidden; overscroll-behavior: none; }
#app { height: 100%; }
.sb-app { height: 100%; display: grid; grid-template-rows: auto auto 1fr; }
button {
  font: 700 13px var(--font-ui); color: var(--accent); background: transparent; border: 1px solid var(--line);
  border-radius: 6px; padding: 5px 10px; min-height: 32px; cursor: pointer; white-space: nowrap;
}
button:hover:not(:disabled) { border-color: var(--accent); }
button:disabled { opacity: .4; cursor: default; }
button:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
button.primary { background: var(--accent); color: var(--on-accent); border-color: var(--accent); }
button.danger { color: var(--minus); border-color: var(--minus); }

.sb-header, .sb-stepbar {
  display: flex; align-items: center; flex-wrap: wrap; gap: 8px 12px;
  padding-block: 6px; padding-left: max(12px, env(safe-area-inset-left, 0px)); padding-right: max(12px, env(safe-area-inset-right, 0px));
  border-bottom: 1px solid var(--line); background: var(--bg);
}
.sb-name { font: 700 16px var(--font-ui); color: var(--text); background: transparent; border: 1px solid transparent; border-radius: 6px; padding: 4px 6px; min-width: 0; width: 16ch; }
.sb-name:hover { border-color: var(--line); }
.sb-status { color: var(--muted); font-size: 12px; flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.sb-actions { display: flex; gap: 6px; flex-wrap: wrap; }

.sb-stepbar { position: relative; background: var(--panel); }
.sb-stepper { display: flex; align-items: center; gap: 6px; }
.sb-stepper > button[aria-label] { font-size: 18px; line-height: 1; padding: 4px 12px; }
.sb-step-label { min-width: 7.5em; text-align: center; color: var(--muted); }
.sb-step-label b { font: 500 18px var(--font-data); color: var(--text); font-variant-numeric: tabular-nums; }
.sb-step-label small { font-size: 12px; }
.sb-seg { display: inline-flex; border: 1px solid var(--line); border-radius: 7px; overflow: hidden; }
.sb-seg button { border: 0; border-radius: 0; color: var(--muted); }
.sb-seg button + button { border-left: 1px solid var(--line); }
.sb-seg button.on { background: var(--accent); color: var(--on-accent); }
.sb-selection { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; padding-left: 10px; border-left: 1px solid var(--line); }
.sb-sel-info { color: var(--muted); font-size: 12px; }
.sb-fit { margin-left: auto; }
.sb-toast { position: absolute; left: max(12px, env(safe-area-inset-left, 0px)); top: calc(100% + 8px); z-index: 600; background: var(--text); color: var(--bg); padding: 6px 10px; border-radius: 6px; font-size: 13px; pointer-events: none; }

.sb-body { display: grid; grid-template-columns: 1fr; min-height: 0; }
.with-sidebar .sb-body { grid-template-columns: 236px 1fr; }
#sb-sidebar { min-height: 0; overflow-y: auto; border-right: 1px solid var(--line); background: var(--panel); }
.sb-sidebar { display: flex; flex-direction: column; gap: 18px; padding: 12px; padding-left: max(12px, env(safe-area-inset-left, 0px)); }
.sb-sidebar h2 { margin: 0 0 8px; font-size: 11px; text-transform: uppercase; letter-spacing: .09em; color: var(--muted); }
.sb-sidebar ol { list-style: none; margin: 0 0 8px; padding: 0; display: flex; flex-direction: column; gap: 6px; }
.sb-slide { display: grid; grid-template-columns: 1.6em 1fr; align-items: start; gap: 4px; width: 100%; padding: 4px; border-color: transparent; }
.sb-slide.on { border-color: var(--accent); }
.sb-num { font: 500 12px var(--font-data); color: var(--muted); text-align: right; padding-top: 2px; }
.sb-thumb { position: relative; aspect-ratio: 16 / 9; max-width: 100%; background: #fff; border: 1px solid var(--line); border-radius: 3px; overflow: hidden; }
.sb-thumb img { position: absolute; inset: 0; width: 100%; height: 100%; max-width: none; }
.sb-row { display: flex; flex-wrap: wrap; gap: 6px; }
.sb-row.end { justify-content: flex-end; }
.sb-steprow { display: flex; justify-content: space-between; width: 100%; color: var(--text); font-weight: 400; border-color: transparent; }
.sb-steprow.on { border-color: var(--accent); color: var(--accent); font-weight: 700; }
.sb-counts { display: flex; gap: 6px; font: 500 12px var(--font-data); }
.sb-counts .plus { color: var(--plus); } .sb-counts .minus { color: var(--minus); } .sb-counts .empty { color: var(--muted); font-family: var(--font-ui); }

.sb-canvas { position: relative; min-width: 0; min-height: 0; }
.sb-canvas > .tl-container, .sb-canvas > div:first-child { position: absolute; inset: 0; }
.sb-slide-frame {
  position: absolute; left: 0; top: 0; pointer-events: none; border: 2px solid var(--frame); border-radius: 2px;
  box-shadow: 0 0 0 100000px rgb(120 130 125 / .08);
}
.sb-lasso { position: absolute; left: 0; top: 0; overflow: visible; pointer-events: none; }
.sb-lasso path { fill: rgb(47 111 143 / .08); stroke: var(--frame); stroke-width: 1.5; stroke-dasharray: 6 5; vector-effect: non-scaling-stroke; }
.sb-lasso-icon { display: flex; align-items: center; justify-content: center; width: 18px; height: 18px; }
.sb-slide-frame span { position: absolute; left: 0; top: -28px; font: 500 16px var(--font-data); color: var(--frame); opacity: .7; }

.sb-player { position: fixed; inset: 0; z-index: 1000; background: #1b1e1f; }
.sb-player .reveal { position: absolute; inset: 0; }

.sb-dialog { width: min(640px, calc(100% - 32px)); background: var(--panel); color: var(--text); border: 1px solid var(--line); border-radius: 10px; padding: 18px; }
.sb-dialog::backdrop { background: rgb(0 0 0 / .4); }
.sb-dialog h2 { margin: 0 0 6px; font-size: 17px; }
.sb-dialog p { margin: 0 0 12px; color: var(--muted); line-height: 1.45; max-width: 60ch; }
.sb-dialog textarea { width: 100%; height: 40vh; box-sizing: border-box; font: 11px var(--font-data); color: var(--text); background: var(--bg); border: 1px solid var(--line); border-radius: 6px; margin-bottom: 10px; }
.sb-error { color: var(--minus) !important; }

@media (max-width: 820px) {
  .with-sidebar .sb-body { grid-template-columns: 172px 1fr; }
  .sb-status { flex-basis: 100%; order: 5; }
}
@media (prefers-reduced-motion: reduce) { * { scroll-behavior: auto !important; } }
</style>
<div id="app"></div>
